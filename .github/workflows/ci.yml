name: Build template PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PDF with XeLaTeX
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compile thesis template
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cput-thesis.tex
          texlive_version: 2026
          os: debian
          latexmk_use_xelatex: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cput-thesis-template-preview
          path: cput-thesis.pdf
          if-no-files-found: error
          retention-days: 14

